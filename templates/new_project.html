{% extends "base.html" %}
{% block title %}New Project{% endblock %}
{% block content %}
<div class="max-w-lg">
    <h1 class="text-2xl font-bold mb-6">New Project</h1>
    <form method="POST" class="bg-white border border-gray-200 rounded-lg p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
            <input name="title" type="text" required
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea name="description" rows="3"
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Budget ($)</label>
            <input name="budget" type="number" step="0.01" min="0"
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
            <select name="status"
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="active">Active</option>
                <option value="completed">Completed</option>
                <option value="paused">Paused</option>
            </select>
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm font-medium">
                Create Project
            </button>
            <a href="/projects" class="px-4 py-2 border border-gray-300 rounded text-sm hover:bg-gray-50">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
