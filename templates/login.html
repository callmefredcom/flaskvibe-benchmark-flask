{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16">
    <h1 class="text-2xl font-bold mb-6 text-center">Sign In</h1>
    <form method="POST" class="bg-white border border-gray-200 rounded-lg p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input name="email" type="email" required autocomplete="email"
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input name="password" type="password" required autocomplete="current-password"
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700 text-sm">
            Sign In
        </button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-4">
        No account? <a href="/register" class="text-blue-600 hover:underline">Register</a>
    </p>
    <p class="text-center text-xs text-gray-400 mt-2">Demo: demo@benchmark.dev / password123</p>
</div>
{% endblock %}
